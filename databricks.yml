bundle:
  name: logistics-delivery-analytics

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog name
    default: workspace
  schema:
    description: Unity Catalog schema name
    default: logistics_dev
  raw_path:
    description: Unity Catalog Volume path containing raw CSV files
    default: /Volumes/workspace/logistics_dev/raw_data
  warehouse_id:
    description: Databricks SQL Warehouse ID
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: workspace
      schema: logistics_dev
      raw_path: /Volumes/workspace/logistics_dev/raw_data

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: logistics
      raw_path: /Volumes/workspace/logistics/raw_data
